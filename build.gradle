import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def node = (project.findProperty('mc') ?: '1.21.11').toString()
def cfg = new JsonSlurper().parse(file('versions.json'))[node]
if (cfg == null) {
	throw new GradleException("Unknown Minecraft version ${node}, see versions.json")
}
def unobf = cfg.unobf == true
apply plugin: unobf ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def centralMirror = repositories.maven {
	name = "Maven Central mirror"
	url = "https://maven-central.storage-download.googleapis.com/maven2/"
}
repositories.remove(centralMirror)
repositories.addFirst(centralMirror)

repositories {
	maven {
		url = "https://maven.dimaskama.net/releases"
		content {
			includeGroup "net.dimaskama"
		}
	}
}

loom {
	mods {
		"whiteclient" {
			sourceSet sourceSets.main
		}
	}
}

if (cfg.gametest == true) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "whiteclient-gametest"
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
}

def modImpl = unobf ? 'implementation' : 'modImplementation'
def modRuntime = unobf ? 'runtimeOnly' : 'modRuntimeOnly'

dependencies {
	minecraft "com.mojang:minecraft:${cfg.minecraft ?: node}"
	if (!unobf) {
		mappings loom.officialMojangMappings()
	}
	add(modImpl, "net.fabricmc:fabric-loader:${project.loader_version}")
	add(modImpl, "net.fabricmc.fabric-api:fabric-api:${cfg.fabric_api}")
	if (cfg.mcef) {
		add(modRuntime, "net.dimaskama:mcef-modern:${cfg.mcef}")
		include "net.dimaskama:mcef-modern:${cfg.mcef}"
	}
}

processResources {
	def props = [version: project.version, minecraft: cfg.range, java: cfg.java]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = cfg.java as int
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
	sourceCompatibility = JavaVersion.toVersion(cfg.java)
	targetCompatibility = JavaVersion.toVersion(cfg.java)
}
