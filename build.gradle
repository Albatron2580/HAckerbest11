plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// MCEF Modern (a Chromium engine mod) is only used to test the browser window in CI. It is NOT part of WHITECLIENT.
	maven {
		url = "https://maven.dimaskama.net/releases"
		content {
			includeGroup "net.dimaskama"
		}
	}
}

loom {
	mods {
		"whiteclient" {
			sourceSet sourceSets.main
		}
	}
}

// Client game test (CI only): boots Minecraft, creates a world and takes screenshots of every feature.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "whiteclient-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modRuntimeOnly "net.dimaskama:mcef-modern:0.3.3+mc1.21.11.jcef146.0.10"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
