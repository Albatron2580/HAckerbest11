name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  nodes:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(python3 -c "import json; print(json.dumps(list(json.load(open('versions.json')))))")" >> "$GITHUB_OUTPUT"

  build:
    needs: nodes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.nodes.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.mc }}-${{ hashFiles('gradle.properties', 'versions.json', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.mc }}-
      - name: Switch sources to Minecraft ${{ matrix.mc }}
        id: cfg
        run: |
          python3 tools/pp.py "${{ matrix.mc }}" src
          echo "gametest=$(python3 -c "import json; print(str(json.load(open('versions.json'))['${{ matrix.mc }}'].get('gametest', False)).lower())")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: chmod +x gradlew && ./gradlew build -Pmc="${{ matrix.mc }}" --stacktrace
      - name: Export JAR
        run: |
          ver=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' \r')
          mkdir -p out
          cp "build/libs/whiteclient-$ver.jar" "out/whiteclient-$ver+mc${{ matrix.mc }}.jar"
          f="out/whiteclient-$ver+mc${{ matrix.mc }}.jar"
          echo "JAR_SHA256=$(sha256sum "$f" | cut -d' ' -f1)"
          echo "@@BEGIN $(basename "$f")"
          base64 -w 900 "$f"
          echo "@@END"
      - name: Client game test (boots Minecraft, takes screenshots)
        id: gametest
        if: steps.cfg.outputs.gametest == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -Pmc="${{ matrix.mc }}" --stacktrace
      - name: Export screenshots and crash reports
        if: always()
        run: |
          ls -la build/run/clientGameTest/screenshots 2>/dev/null || true
          for f in build/run/clientGameTest/screenshots/*.png; do
            [ -f "$f" ] || continue
            j="${f%.png}.jpg"
            convert "$f" -quality 85 "$j"
            echo "@@BEGIN $(basename "$j")"
            base64 -w 900 "$j"
            echo "@@END"
          done
          for c in build/run/clientGameTest/crash-reports/*.txt; do
            [ -f "$c" ] && { echo "==== CRASH $c"; cat "$c"; }
          done
          grep -i "whiteclient" build/run/clientGameTest/logs/latest.log 2>/dev/null | head -100 || true
      - name: Mark result
        if: always()
        run: |
          shots=$(ls build/run/clientGameTest/screenshots/*.png 2>/dev/null | wc -l)
          echo "screenshots: $shots"
          if [ -n "$(ls out/*.jar 2>/dev/null)" ]; then echo "$shots" > out/screenshots.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-${{ matrix.mc }}
          path: out

  release:
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/whiteclient-build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: nodes
      - name: Publish release (WHITECLIENT's auto update downloads it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' \r')
          if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver is already released"; exit 0; fi
          ready=$(python3 -c "import json; print(' '.join(k for k, v in json.load(open('versions.json')).items() if v.get('ready')))")
          gametest=$(python3 -c "import json; print(' '.join(k for k, v in json.load(open('versions.json')).items() if v.get('gametest')))")
          mkdir -p rel
          for mc in $ready; do
            jar="nodes/node-$mc/whiteclient-$ver+mc$mc.jar"
            if [ ! -f "$jar" ]; then echo "no jar for $mc, not publishing"; exit 0; fi
            shots=$(cat "nodes/node-$mc/screenshots.txt" 2>/dev/null || echo 0)
            case " $gametest " in *" $mc "*) if [ "$shots" -lt 60 ]; then echo "game test for $mc did not finish ($shots screenshots), not publishing"; exit 0; fi;; esac
            cp "$jar" rel/
          done
          if [ -f "rel/whiteclient-$ver+mc1.21.11.jar" ]; then cp "rel/whiteclient-$ver+mc1.21.11.jar" "rel/whiteclient-$ver.jar"; fi
          (cd rel && for f in *.jar; do sha256sum "$f" > "$f.sha256"; done; ls -la)
          list=$(echo $ready | sed 's/ /, /g')
          gh release create "v$ver" rel/* --target "$GITHUB_SHA" --title "WHITECLIENT $ver" \
            --notes "WHITECLIENT $ver (Fabric) for Minecraft $list. Pick the jar that ends in your Minecraft version (for example +mc1.21.11) and put it in your mods folder together with Fabric API. WHITECLIENT updates itself after that."
          echo "published v$ver"
