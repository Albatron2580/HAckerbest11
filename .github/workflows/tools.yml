name: tools
on:
  workflow_dispatch:
    inputs:
      task:
        description: "info | migrate | sources"
        required: true
        default: info
      versions:
        description: "JSON list of Minecraft versions for sources"
        required: false
        default: '["1.21.11"]'
      query:
        description: "bash run inside the decompiled sources (helpers: sig Class..., has regex [n], cls Name)"
        required: false
        default: 'cls Minecraft'

jobs:
  info:
    if: inputs.task == 'info'
    runs-on: ubuntu-24.04
    steps:
      - name: Versions
        run: |
          echo "== game versions (stable)"
          curl -s https://meta.fabricmc.net/v2/versions/game | python3 -c "import sys,json; print(' '.join(v['version'] for v in json.load(sys.stdin) if v['stable']))"
          echo "== loader"
          curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import sys,json; print(' '.join(v['version'] for v in json.load(sys.stdin)[:5]))"
          echo "== loom"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -15 | tr '\n' ' '
          echo
          echo "== fabric api"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' > fapi.txt
          for mc in 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1 26.1.1 26.1.2 26.2 26.2.1 26.2.2 26.3 26.3.1 26.3.2; do
            echo "$mc: $(grep -E "\+$mc$" fapi.txt | tail -1)"
          done
          echo "== mcef-modern"
          curl -s https://maven.dimaskama.net/releases/net/dimaskama/mcef-modern/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tr '\n' ' '
          echo

  migrate:
    if: inputs.task == 'migrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Migrate main sources to Mojang names
        run: chmod +x gradlew && ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup --stacktrace
      - name: Migrate game test sources to Mojang names
        continue-on-error: true
        run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" --input src/gametest/java --overrideInputsIHaveABackup --stacktrace
      - name: Migrate access wideners and class tweakers
        continue-on-error: true
        run: ./gradlew migrateClassTweakerMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup --stacktrace
      - name: Export migrated sources through the log
        run: |
          git status --short --untracked-files=all | head -30
          git diff --stat | tail -3
          find . -path ./.git -prune -o -type d -name 'remapped*' -print
          zip -qr /tmp/migrated.zip src $(find . -maxdepth 2 -type d -name 'remapped*' -not -path './.git*')
          ls -la /tmp/migrated.zip
          echo "@@BEGIN migrated.zip"
          base64 -w 900 /tmp/migrated.zip
          echo "@@END"

  sources:
    if: inputs.task == 'sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(inputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/mcsrc
          key: mcsrc-v1-${{ matrix.mc }}
      - name: Decompile Minecraft ${{ matrix.mc }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mc='${{ matrix.mc }}'
          p=/tmp/p; mkdir -p $p/src/main/java; cp -r gradlew gradle $p/
          case "$mc" in 2[0-9].*) plugin=net.fabricmc.fabric-loom; maps="";; *) plugin=net.fabricmc.fabric-loom-remap; maps="mappings loom.officialMojangMappings()";; esac
          cp settings.gradle $p/
          printf "plugins { id '%s' version '%s' }\ndependencies {\n minecraft 'com.mojang:minecraft:%s'\n %s\n}\n" "$plugin" "$(grep ^loom_version gradle.properties | cut -d= -f2)" "$mc" "$maps" > $p/build.gradle
          cd $p && chmod +x gradlew && ./gradlew genSources -q
          jar=$(find ~/.gradle $p/.gradle -name '*sources.jar' 2>/dev/null | grep -i minecraft | grep -iv common | head -1)
          echo "sources: $jar"
          mkdir -p /tmp/mcsrc && cd /tmp/mcsrc && unzip -q -o "$jar" 'net/minecraft/*' 'com/mojang/*' || true
          find /tmp/mcsrc -name '*.java' | wc -l
      - name: Query
        env:
          QUERY: ${{ inputs.query }}
        run: |
          cd /tmp/mcsrc
          sig() { for f in "$@"; do p=$(find . -path "*/$f.java" | head -1); echo "### $f ($p)"; [ -n "$p" ] && grep -nE '^\s*(public|protected|private|static|final|abstract|default|record|class|interface|enum|@)' "$p" | grep -v '^\s*//' | cut -c1-220; done; }
          has() { grep -rn --include=*.java -E "$1" . | head -${2:-40} | cut -c1-240; }
          cls() { find . -name "$1.java" | head -5; }
          echo "======== MC ${{ matrix.mc }}"
          eval "$QUERY"
